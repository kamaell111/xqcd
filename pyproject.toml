[tool.ruff]
target-version = "py311"
line-length = 200
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "backend/data",
    "frontend",
]

[tool.ruff.lint]
# Focus on real bugs (pyflakes F) only — skip style rules
select = ["F"]
ignore = [
    "F401",  # unused import
    "F403",  # star imports
    "F405",  # maybe undefined from star
    "F811",  # redefined
    "F841",  # unused variable
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F821"]
"backend/scripts/*" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
